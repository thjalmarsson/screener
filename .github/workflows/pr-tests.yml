name: PR tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      localstack:
        # Last Community release; newer images require LocalStack authentication.
        image: localstack/localstack:4.14.0
        env:
          SERVICES: dynamodb
          AWS_DEFAULT_REGION: eu-west-1
          PERSISTENCE: "0"
        ports:
          - 4566:4566
        options: >-
          --health-cmd "awslocal dynamodb list-tables --region eu-west-1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Create DynamoDB test resources
        env:
          LOCALSTACK_CONTAINER: ${{ job.services.localstack.id }}
        run: docker exec -i "$LOCALSTACK_CONTAINER" bash < scripts/ci/init-dynamodb.sh

      - name: Build and test all modules
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Show LocalStack logs on failure
        if: failure()
        env:
          LOCALSTACK_CONTAINER: ${{ job.services.localstack.id }}
        run: docker logs "$LOCALSTACK_CONTAINER"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7
